<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathe-Übung: Funktionen</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5d667a;--ac:#2f6df6;--ok:#1a9a52;--no:#d83a3a;--bd:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161f;--card:#1b2130;--tx:#e8ebf2;--mu:#9aa3b8;--ac:#6c9bff;--ok:#43c47c;--no:#ff6b6b;--bd:#2c3447;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161f;--card:#1b2130;--tx:#e8ebf2;--mu:#9aa3b8;--ac:#6c9bff;--ok:#43c47c;--no:#ff6b6b;--bd:#2c3447;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.sub{color:var(--mu);margin:0 0 14px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.card h2{font-size:1.1rem;margin:0 0 6px}
.vid{display:inline-block;margin-top:6px;padding:8px 12px;border-radius:10px;background:#e62117;color:#fff;text-decoration:none;font-weight:600}
.q{border-top:1px solid var(--bd);padding:12px 0}
.q:first-of-type{border-top:0}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button,.chk{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:9px 12px;border-radius:10px;font:inherit;text-align:left;cursor:pointer}
.opts button.ok,.q.ok .chk{border-color:var(--ok)}
.opts button.no{border-color:var(--no)}
.opts button.sel{border-color:var(--ac);background:var(--card);font-weight:600}
.res{font-size:1.1rem;font-weight:600;margin-top:10px}
.vt{font-weight:600;margin-top:14px}
.vf{position:relative;padding-top:56.25%;margin:6px 0 2px;border-radius:10px;overflow:hidden;background:#000}
.vf iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vc{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);text-decoration:none}
.vc .pl{flex:none;width:36px;height:36px;border-radius:50%;background:#e62117;color:#fff;display:grid;place-items:center}
.vc .vt{margin:0}
.tw{overflow-x:auto;margin:6px 0 10px}
.tb{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--bd);border-radius:12px;overflow:hidden;font-variant-numeric:tabular-nums}
.tb td{padding:10px 12px;text-align:center;border-top:1px solid var(--bd);border-left:1px solid var(--bd)}
.tb tr:first-child td{border-top:0;background:var(--bg)}
.tb td.th{text-align:left;font-weight:600;background:var(--bg);border-left:0;white-space:nowrap}
.tb tr:first-child td:not(.th){font-weight:600;color:var(--ac)}
.tb{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.tb td{font-weight:600;font-size:1.05rem}
.tb td.th{text-transform:uppercase;font-size:.78rem;letter-spacing:.06em;color:var(--mu)}
.tb td.up{color:var(--ok)}
.tb td.dn{color:var(--no)}
.ex{background:var(--bg);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:8px 12px;margin:0 0 10px;font-size:.95rem}
.ex summary{cursor:pointer;font-weight:600;color:var(--ac)}
.ex div{margin-top:6px}
input[type=text]{width:110px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.chk{display:inline-block;margin-left:6px;background:var(--ac);color:#fff;border-color:var(--ac);text-align:center}
.fb{margin-top:6px;font-size:.95rem;min-height:1.2em}
.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.score{position:sticky;top:env(safe-area-inset-top,0px);z-index:2;background:var(--bg);padding:6px 0;color:var(--mu);font-size:.95rem}
svg{width:100%;height:auto;max-width:340px;display:block;margin:6px auto;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.sl{display:flex;align-items:center;gap:8px;margin:4px 0}.sl input{flex:1}
.sl span{width:92px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
<h1>Mathe-Übung: Funktionen</h1>
<p class="sub">Wähle ein Thema, schau das Video und löse die Aufgaben.</p>

<div class="score" id="score"></div>
<div id="view"></div>
</main>

var EX={fe:[`Beispiel: Kreuze bei x = 1 (y = 5), x = 2 (y = 6) und x = 3 (y = 6). Über jedem x steht nur ein Kreuz, also ist es eine Funktion. Gleiche Höhe ist erlaubt. Stehen über einem x zwei Kreuze, ist es keine Funktion.`,`Beispiel: f(x) = 2x + 5, gesucht ist f(3). Setze 3 für x ein: 2 · 3 + 5 = 11.`,`Beispiel: f(x) = 4x − 1, gesucht ist y zu x = −2. Einsetzen: 4 · (−2) − 1 = −9. Achte auf Minus mal Plus.`,`Beispiel: x: 0, 1, 2 und y: 3, 5, 7. Bei x = 0 ist y = 3, das ist die Zahl ohne x. Pro Schritt wächst y um 2, also y = 2x + 3.`,`Beispiel: f(x) = 3x + 1 und y = 10. Setze y ein: 10 = 3x + 1, dann 9 = 3x, also x = 3.`,`Beispiel: Person → Geburtsdatum ist eine Funktion, denn jede Person hat genau ein Geburtsdatum. Merke: Zu jedem x gehört genau ein y.`,`Beispiel: x: 1, 2, 3 und y: 4, 4, 5. In der oberen Zeile wiederholt sich nichts, also ist es eine Funktion. Stünde oben zweimal die 2 mit verschiedenen y-Werten, wäre es keine.`,`Beispiel: 2 Arbeiter brauchen 12 Tage, 4 Arbeiter 6 Tage. Doppelt so viele Arbeiter, halb so viele Tage heißt umgekehrt proportional. Arbeiter × Tage bleibt gleich (24).`,`Beispiel: 3 Arbeiter brauchen 8 Tage, also Arbeiter × Tage = 24. Für 6 Arbeiter: 24 ÷ 6 = 4 Tage.`,`Beispiel: Arbeiter × Tage = 24. Sollen es nur 3 Tage sein, braucht man 24 ÷ 3 = 8 Arbeiter.`,`Beispiel: f(x) = 3x + 1. Bei x = −1: 3 · (−1) + 1 = −2. Bei x = 0: y = 1. Bei x = 2: y = 7. Rechne jede Spalte einzeln.`,`Beispiel: f(x) = −2x + 1. Bei x = 3: −2 · 3 + 1 = −5. Bei x = −1: −2 · (−1) + 1 = 3.`,`Beispiel: Tag 1 → 2 °C, Tag 2 → 3 °C, Tag 3 → 3 °C. Jedem Tag gehört genau eine Temperatur, also ist es eine Funktion. Zwei Tage mit gleicher Temperatur sind kein Problem.`,`Beispiel: Tag → Temperatur ist eine Funktion. Dreht man um (Temperatur → Tag) und eine Temperatur kommt zweimal vor, hat sie zwei Tage. Dann ist es keine Funktion mehr.`,`Beispiel: Kreuze bei Tag 1 (2 °C) und Tag 2 (5 °C). Für den 2. Tag gehst du bei 2 nach oben bis zum Kreuz und liest links 5 ab.`],
st:[`Beispiel: P(1|1) und Q(3|5). Höhenunterschied: 5 − 1 = 4. Schritt nach rechts: 3 − 1 = 2. Steigung: m = 4 ÷ 2 = 2.`,`Beispiel: P(0|6) und Q(2|2). Höhenunterschied: 2 − 6 = −4, Schritt nach rechts: 2. m = −4 ÷ 2 = −2. Fällt die Gerade, ist m negativ.`,`Beispiel: 4 Schritte nach rechts und 3 nach oben ergeben m = 3 ÷ 4 = 0,75. Immer: nach oben durch nach rechts.`,`Beispiel: Steigt eine Gerade nach rechts, ist m positiv. Fällt sie, ist m negativ. Verläuft sie waagerecht, gibt es keinen Höhenunterschied, also m = 0.`,`Beispiel: P(−1|2) und Q(3|10). Höhenunterschied: 8, Schritt nach rechts: 3 − (−1) = 4. m = 8 ÷ 4 = 2. Achte auf Minus minus.`,`Beispiel: Von (0|5) nach (2|1) geht es nach unten, m = (1 − 5) ÷ 2 = −2. Ein fallender Graph hat immer eine negative Steigung.`],
pr:[`Beispiel: y = 5x ist proportional, y = 5x + 2 nicht. Bei proportionalen Funktionen steht nur m · x, ohne Zahl dazu.`,`Beispiel: 2 kg Birnen kosten 6 €, wie viel kosten 5 kg? 1 kg kostet 6 ÷ 2 = 3 €, also kosten 5 kg 5 · 3 = 15 €.`,`Beispiel: x = 5 und y = 20. Der Faktor ist m = y ÷ x = 20 ÷ 5 = 4.`,`Beispiel: y = 3x. Bei x = 0 ist y = 0. Darum geht der Graph proportionaler Funktionen immer durch den Ursprung (0|0).`,`Beispiel: y = 6x und x = 1,5. Einsetzen: 6 · 1,5 = 9.`,`Beispiel: x: 2, 4 und y: 6, 12. Teile y durch x: 6 ÷ 2 = 3 und 12 ÷ 4 = 3. Der Faktor ist gleich, also proportional. Kommt Verschiedenes heraus, ist es nicht proportional.`,`Beispiel: y = 2x. x = 3 ergibt y = 6, x = −1 ergibt y = −2, x = 0 ergibt y = 0.`],
li:[`Beispiel: y = 3x + 4. Die Zahl ohne x ist b, hier 4. An dieser Stelle schneidet der Graph die y-Achse.`,`Beispiel: Gerade durch (0|3) mit m = 4. Der y-Wert bei x = 0 ist b = 3, die Steigung ist m = 4, also y = 4x + 3.`,`Beispiel: y = −2x + 5 bei x = 4. Einsetzen: −2 · 4 + 5 = −3.`,`Beispiel: y = 4x − 8. Nullstelle heißt y = 0: 0 = 4x − 8, also 4x = 8 und x = 2.`,`Beispiel: y = 2x + 3 und y = 2x − 7 haben beide m = 2, also sind sie parallel. Parallel heißt gleiche Steigung, b darf anders sein.`,`Beispiel: Durch (0|1) und (2|5): m = (5 − 1) ÷ (2 − 0) = 2. Immer y-Unterschied durch x-Unterschied.`,`Beispiel: m = 3 und b = −1 ergibt y = 3x − 1. Erst m vor das x, dann b dahinter mit Vorzeichen.`,`Beispiel: y = 2x + 1. x = 0 ergibt 1, x = 1 ergibt 3, x = 2 ergibt 5. Rechne erst m · x, dann + b.`]};
EX={fe:[`So geht's: Schau auf die Kreuze. Steht über jedem x nur ein Kreuz, ist es eine Funktion. Hier haben x = 1, 2 und 3 je ein Kreuz, also Funktion. Zwei Kreuze auf gleicher Höhe sind okay. Zwei Kreuze übereinander (gleiches x) sind nicht okay.`,`So geht's: f(x) = 2x + 5, gesucht f(3). Das heißt: Nimm 3 statt x. 2 · 3 = 6, dann + 5 = 11.`,`So geht's: f(x) = 4x − 1 und x = −2. Nimm −2 statt x: 4 · (−2) = −8, dann − 1 = −9. Plus mal Minus gibt Minus.`,`So geht's: Schau auf x = 0. Dort ist y = 3. Das ist die Zahl hinten. Bei jedem Schritt wird y um 2 größer. Das ist die Zahl vor dem x. Also y = 2x + 3.`,`So geht's: f(x) = 3x + 1 und y = 10. Schreibe: 10 = 3x + 1. Nimm 1 weg: 9 = 3x. Teile durch 3: x = 3.`,`So geht's: Jede Person hat genau einen Geburtstag. Darum ist Person → Geburtstag eine Funktion. Merke: Zu jedem x gehört genau ein y.`,`So geht's: Schau nur auf die obere Zeile (x). Kommt dort keine Zahl doppelt vor, ist es eine Funktion. Hier: 1, 2, 3, also Funktion. Wäre oben zweimal die 2 mit verschiedenen y, dann nicht.`,`So geht's: Mehr Arbeiter, weniger Tage. 2 Arbeiter brauchen 12 Tage, 4 Arbeiter nur 6 Tage. Doppelt so viele Arbeiter, halb so viele Tage. Das heißt umgekehrt proportional. Tipp: Arbeiter mal Tage ist immer gleich (hier 24).`,`So geht's: 3 Arbeiter brauchen 8 Tage. 3 · 8 = 24. Für 6 Arbeiter: 24 ÷ 6 = 4 Tage.`,`So geht's: Arbeiter mal Tage ist 24. Es sollen 3 Tage sein: 24 ÷ 3 = 8 Arbeiter.`,`So geht's: f(x) = 3x + 1. Rechne jede Spalte einzeln. x = −1: 3 · (−1) + 1 = −2. x = 0: 3 · 0 + 1 = 1. x = 2: 3 · 2 + 1 = 7.`,`So geht's: f(x) = −2x + 1. x = 3: −2 · 3 + 1 = −5. x = −1: −2 · (−1) + 1 = 3. Minus mal Minus gibt Plus.`,`So geht's: Tag 1 → 2 °C, Tag 2 → 3 °C, Tag 3 → 3 °C. Jeder Tag hat genau eine Temperatur, also Funktion. Dass zwei Tage gleich warm sind, ist egal.`,`So geht's: Tag → Temperatur ist eine Funktion. Dreht man es um (Temperatur → Tag) und eine Temperatur kommt zweimal vor, hat sie zwei Tage. Dann ist es keine Funktion mehr.`,`So geht's: Such den Tag unten auf der x-Achse (hier Tag 2). Geh nach oben bis zum Kreuz. Geh dann nach links und lies ab: 5 °C.`],
st:[`So geht's: Steigung m = nach oben ÷ nach rechts. P(1|1) und Q(3|5): Von P nach Q geht es 2 nach rechts (3 − 1) und 4 nach oben (5 − 1). m = 4 ÷ 2 = 2.`,`So geht's: P(0|6), Q(2|2). Nach rechts: 2. Nach oben: 2 − 6 = −4, also 4 nach unten. m = −4 ÷ 2 = −2. Geht die Gerade nach unten, ist m negativ.`,`So geht's: Zähle die Schritte: 4 nach rechts und 3 nach oben. m = oben ÷ rechts = 3 ÷ 4 = 0,75.`,`So geht's: Geht die Gerade nach oben, ist m positiv. Geht sie nach unten, ist m negativ. Ist sie waagerecht, geht sie nicht hoch und nicht runter, also m = 0.`,`So geht's: P(−1|2), Q(3|10). Nach oben: 10 − 2 = 8. Nach rechts: 3 − (−1) = 4 (Minus minus gibt Plus). m = 8 ÷ 4 = 2.`,`So geht's: Von (0|5) nach (2|1) geht es nach unten. Oben: 1 − 5 = −4, rechts: 2. m = −4 ÷ 2 = −2. Gerade fällt, also m negativ.`],
pr:[`So geht's: Proportional heißt: nur m mal x, nichts dazu. y = 5x ist proportional. y = 5x + 2 nicht, wegen dem + 2.`,`So geht's: 2 kg kosten 6 €. Erst 1 kg: 6 ÷ 2 = 3 €. Dann mal 5: 5 · 3 = 15 €.`,`So geht's: m = y ÷ x. Hier: 20 ÷ 5 = 4. Bei jedem Schritt nach rechts geht die Gerade 4 hoch.`,`So geht's: Setze x = 0 ein: y = 3 · 0 = 0. Der Punkt (0|0) heißt Ursprung. Proportionale Geraden gehen immer dadurch.`,`So geht's: y = 6x und x = 1,5. Nimm 1,5 statt x: 6 · 1,5 = 9.`,`So geht's: Teile jedes y durch sein x. 6 ÷ 2 = 3 und 12 ÷ 4 = 3. Immer die gleiche Zahl, also proportional. Kommt Verschiedenes raus, ist es nicht proportional.`,`So geht's: y = 2x. Rechne jeden x-Wert mal 2: x = 3 gibt 6, x = −1 gibt −2, x = 0 gibt 0.`],
li:[`So geht's: Bei y = 3x + 4 ist b die Zahl ohne x, also 4. Dort schneidet die Gerade die y-Achse.`,`So geht's: Die Gerade geht durch (0|3), also b = 3. m = 4 ist gegeben. Schreibe y = m · x + b, also y = 4x + 3.`,`So geht's: y = −2x + 5 und x = 4. Nimm 4 statt x: −2 · 4 = −8, dann + 5 = −3.`,`So geht's: Nullstelle heißt: y ist 0. Also 0 = 4x − 8. Rechne + 8: 8 = 4x. Teile durch 4: x = 2.`,`So geht's: Parallel heißt: gleiche Steigung m. y = 2x + 3 und y = 2x − 7 haben beide m = 2. Nur die Zahl hinten (b) ist anders. Also parallel.`,`So geht's: Durch (0|1) und (2|5). Nach oben: 5 − 1 = 4. Nach rechts: 2 − 0 = 2. m = 4 ÷ 2 = 2.`,`So geht's: m = 3 und b = −1. Schreibe m vor das x und b dahinter: y = 3x − 1.`,`So geht's: y = 2x + 1. Rechne erst 2 · x, dann + 1. x = 0 gibt 1, x = 1 gibt 3, x = 2 gibt 5.`]};
